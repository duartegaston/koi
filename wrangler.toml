name = "koi"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# OpenNext sirve los assets estáticos desde este binding.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Lo pide el starter de OpenNext para revalidación y rutas internas.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "koi"

# workers.dev queda como respaldo. El sitio público es koichocolates.com.ar.
workers_dev = true

[[routes]]
pattern = "koichocolates.com.ar"
custom_domain = true

[[routes]]
pattern = "www.koichocolates.com.ar"
custom_domain = true

# Variables no sensibles. Los secretos (DATABASE_URL, RESEND_API_KEY, EMAIL_FROM,
# WHATSAPP_NUMBER, ADMIN_USERNAME, ADMIN_PASSWORD_HASH, ADMIN_SESSION_SECRET,
# STORE_PICKUP_ADDRESS, STORE_TRANSFER_ALIAS, STORE_ORIGIN_LATITUDE,
# STORE_ORIGIN_LONGITUDE, GOOGLE_MAPS_API_KEY) se cargan con `wrangler secret bulk`.
# Mercado Pago queda afuera de este deploy: el checkout no lo ofrece.
[vars]
APP_URL = "https://koichocolates.com.ar"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "145642e3be074eba9cf4f1f30bd02c70"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "koi-product-images"
# La base ya apunta a objetos de este bucket. En next dev hay que leer el mismo R2.
remote = true
